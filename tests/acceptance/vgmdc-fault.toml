# A Vector Graphic System B whose CP/M disk has a bad sector (#971) -- for vgmdc-fault.exp.
#
# `faults` is the drive's bad-sector list. A Vector address is <track>/<side>/<sector>: the
# track under the head, the side, and the hard-sector number 0-15. VG08.VGI is Lifeboat CP/M
# 2.20B for the Micropolis board; its console is serial port A of the Bitstreamer II. Its loader
# reads track 0 at boot and checks each sector's checksum: a hard data fault on 0/0/1 and the
# boot never ends. count=2: two bad checksums, the loader reads again, and the third read is good.
#
# The directory starts at 2/0/0. The BIOS tries a sector 100 times. A hard data or id fault there
# gets 100 hits, a missing fault 100 or 101 (the .exp says why), and DIR gives Bdos Err On A: Bad
# Sector. Found with FAULT ADD 1/0/*, 2/0/* and 3/0/* and the hit counts; do not move the fault
# without checking.
#
# FLAT OUT, WITH NO VIDEO BOARD. At 4 MHz each of the BIOS's 100 tries waits a turn of the disk,
# 20 seconds for each error. The guest prints nothing on the Flashwriter, so it is removed, and
# no window opens.
#
# NOTHING WRITES TO THE IMAGE. `writeprotect = true` protects the disk, and a fault never changes
# it. The .exp shasums the image before and after.
[machine]
name    = "vgmdc-fault"
base    = "vg3sb"
startup = ["RUN F800"]

[[board]]
id       = "cpu0"
clock_hz = 0

[[board]]
id     = "fw0"
remove = true

[[board]]
id = "bs0"

  [board.unit.a]
  connect = "console"

[[board]]
id = "mdc0"

  [[board.drive]]
  unit         = 0
  mount        = "../media/vector/VG08.VGI"
  writeprotect = true
  faults       = "0/0/1 data count=2"
