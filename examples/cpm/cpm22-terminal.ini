; CP/M 2.2 on a built-in VT100 terminal window.
;
; The .ini twin of cpm22-terminal.toml beside it: the SAME machine, set up by MONITOR
; COMMANDS instead of a declarative TOML, as an easy landing for anyone arriving from
; AltairZ80. Every line is one you could type at the altairsim> prompt.
;
; RUN IT (from this directory):
;
;   From the command line:      altairsim -s cpm22-terminal.ini
;   From the altairsim> prompt: DO cpm22-terminal.ini
;
;   -> a VT100 window opens; the CP/M banner and the A> prompt appear IN IT. The monitor's
;      altairsim> prompt stays in the terminal you launched from. (Needs an SDL build.)
;
; `MACHINE default` loads the 56K CP/M Altair (the TOML's `base = "default"`). Then, instead
; of leaving the 2SIO's channel A on the host console, this re-plugs it into a built-in VT100
; terminal window -- so the guest talks to an emulated CRT, not the terminal you launched
; from. Everything else is the same disk and boot as cpm22-buffered.ini.

MACHINE default                       ; the 56K CP/M Altair, DBL boot PROM at FF00
SET DISPLAY crt=true                  ; give the window a CRT look

; Re-plug the console channel (sio0:a) from the host terminal into a built-in VT100:
CONNECT sio0:a "terminal?emulation=vt100&size=80x24&width=1100"
SET DISPLAY focus=true                ; put keyboard focus in the VT100 window on open
SET TERMINAL bsdel=bs                  ; the terminal's BACKSPACE sends BS, as CP/M expects

MOUNT dsk0:drive0 "cpm22b23-56k.dsk"  ; the system floppy in drive 0 (A:)
RUN FF00                              ; boot CP/M -- its output lands in the VT100 window
