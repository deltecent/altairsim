; CP/M 2.2 -- track-buffered, on the default Altair.
;
; The .ini twin of cpm22-buffered.toml beside it: the SAME machine, set up by MONITOR
; COMMANDS instead of a declarative TOML, as an easy landing for anyone arriving from
; AltairZ80 -- whose .ini files SET and ATTACH exactly like this. Every line is one you
; could type at the altairsim> prompt.
;
; RUN IT (from this directory):
;
;   From the command line:      altairsim -s cpm22-buffered.ini
;   From the altairsim> prompt: DO cpm22-buffered.ini
;
;   -> You land at the A> prompt. Type DIR to see what is on the disk.
;
; `MACHINE default` loads the 56K Altair with the DBL boot PROM at FF00 -- the same machine
; `altairsim` gives you when you name none, and exactly what the TOML's `base = "default"`
; inherits. That IS the CP/M Altair, so there is nothing to build: all this file adds is the
; floppy in drive 0 and the boot. (A file that builds its OWN machine from an empty backplane
; opens with `MACHINE none` instead -- see the basic examples.)
;
; Drive 0 is mounted read/write, because a real machine is. If you are about to test writes
; in anger, copy the image first, or add `readonly` to the MOUNT.

MACHINE default                       ; the 56K CP/M Altair, DBL boot PROM at FF00
MOUNT dsk0:drive0 "cpm22b23-56k.dsk"  ; the system floppy in drive 0 (A:)
SET CONSOLE bsdel=bs                   ; the Altair's BACKSPACE key sends BS, as CP/M expects
RUN FF00                               ; throw the RUN switch on the DBL PROM -> boots CP/M
