; CP/M 2.2 with a buggy HELLO.ASM -- the machine an AI assistant debugs over --mcp.
;
; The .ini twin of cpm-ai.toml beside it: the SAME machine, set up by MONITOR COMMANDS
; instead of a declarative TOML, as an easy landing for anyone arriving from AltairZ80.
; Every line is one you could type at the altairsim> prompt.
;
; RUN IT (from this directory):
;
;   From the command line:      altairsim -s cpm-ai.ini
;   From the altairsim> prompt: DO cpm-ai.ini
;
;   -> You land at the A> prompt. TYPE HELLO.ASM to see the program with the bug.
;
; `MACHINE default` loads the 56K CP/M Altair (the TOML's `base = "default"`); all this file
; adds is the disk in drive 0 and the boot. The disk is Douglas Miller's track-buffered CP/M
; 2.2b -- the same image examples/cpm boots -- with HELLO.ASM, a tiny program with a
; deliberate bug, dropped on for the walkthrough.
;
; This is the HUMAN boot path. Under --mcp the assistant does NOT run a startup: it boots the
; machine itself with `run {from: 0xFF00}` and drives it over JSON-RPC. See DRIVING-WITH-AI.md
; and README.md beside this file.

MACHINE default                       ; the 56K CP/M Altair, DBL boot PROM at FF00
MOUNT dsk0:drive0 "cpm22b23-56k.dsk"  ; the CP/M system disk, with HELLO.ASM on it
SET CONSOLE bsdel=bs                   ; the Altair's BACKSPACE key sends BS, as CP/M expects
RUN FF00                               ; boot CP/M
