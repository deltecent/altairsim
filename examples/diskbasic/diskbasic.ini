; Altair Disk Extended BASIC, off an 8" floppy.
;
; The .ini twin of diskbasic.toml beside it: the SAME machine, set up by MONITOR COMMANDS
; instead of a declarative TOML, as an easy landing for anyone arriving from AltairZ80.
; Every line is one you could type at the altairsim> prompt.
;
; RUN IT (from this directory):
;
;   From the command line:      altairsim -s diskbasic.ini
;   From the altairsim> prompt: DO diskbasic.ini
;
;   MEMORY SIZE? <return>
;   HIGHEST DISK NUMBER?  0      -- one drive, numbered from zero
;
; `MACHINE default` loads the 56K Altair with the DBL boot PROM at FF00 -- exactly what the
; TOML's `base = "default"` inherits. That IS the disk Altair; all this file adds is the
; floppy in drive 0 and the boot. Drive 0 is read/write; copy the image first if you mean to
; experiment in anger. To reach a second disk, MOUNT it and raise the HIGHEST DISK NUMBER:
;   MOUNT dsk0:drive1 "my-data.dsk"

MACHINE default                       ; the 56K Altair, DBL boot PROM at FF00
MOUNT dsk0:drive0 "Disk BASIC 4.1.dsk"
SET CONSOLE upper=true                ; Disk BASIC, like the Teletype, speaks upper case
RUN FF00                              ; boot the disk
