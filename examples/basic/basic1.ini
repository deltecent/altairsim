; Altair BASIC 1.0 -- the FIRST one -- off a period cassette.
;
; This is the .ini twin of basic1.toml beside it: the SAME machine and the same session,
; built by MONITOR COMMANDS instead of a declarative TOML. It is here as an easy landing
; for anyone arriving from AltairZ80, whose .ini files build a machine with SET and ATTACH
; the same way -- these are just altairsim's commands, and every one is a line you could
; type at the altairsim> prompt yourself.
;
; RUN IT (from this directory):
;
;   From the command line:      altairsim -s basic1.ini
;   From the altairsim> prompt: DO basic1.ini
;
;   -> the tape loads, the machine goes quiet; press ^E, then type:  RUN 0
;   -> MEMSIZ?
;
; This file opens with `MACHINE none`, so it EMPTIES whatever machine was loaded and builds
; its own from an empty backplane -- the bare 1975 Altair, an 88-SIO for the Teletype, an
; 88-ACR for the recorder, 8K of RAM. BASIC 1.0's machine is not a built-in, so it is built
; by hand here; a file whose machine IS a built-in just says `MACHINE <name>` (see
; basic4k.ini), and one that tweaks the DEFAULT machine says `MACHINE default` (see
; examples/cpm/cpm22-buffered.ini).
;
; WHY THE BOOT IS TWO MOVES. BASIC 1.0's bootstrap (LOAD10) copies the tape into memory
; from 0000 and LOOPS FOREVER -- it has no idea how long the tape is, so it never stops and
; never jumps to what it loaded. That is genuinely how you booted it: the operator watched
; the tape run out, hit STOP/RESET, and ran BASIC by hand from 0. So RUN 1800 reads the
; whole tape in (about a second, flat out); ^E is the STOP switch when it is done; RUN 0
; starts BASIC.
;
; WANT TO WATCH IT LOAD? `SET acr0:tape rate=real` before you run plays the tape at its true
; 300-baud speed -- about two and a half minutes -- and the counter climbs 00:00 -> 02:30.

; ---- Build the machine (empty backplane -> the bare 1975 Altair) ----
MACHINE none                          ; empty the backplane; the rest builds onto it
BOARDS ADD fp fp0 sense=0x00          ; front panel; BASIC 1.0 reads no sense switches
BOARDS ADD 8080 cpu0 clock_hz=0       ; flat out (the default). clock_hz=2000000 for real 2 MHz
BOARDS ADD sio sio0 port=0            ; the 88-SIO console at port 0 -- where BASIC 1.0 looks
CONNECT sio0 console                  ; its one serial line carries the host console
BOARDS ADD acr acr0 port=6            ; the 88-ACR cassette at 006 (IN 06 / IN 07)
SET acr0:tape counter=on              ; print the live tape counter as it plays
BOARDS ADD memory mem0 fill=random    ; real static RAM comes up dirty; BASIC's scan must not care
REGION ADD mem0 type=ram at=0 size=8K ; 8K: BASIC 1.0 loads to 0000-117F, so 4K will not do

; THE TELETYPE. MITS BASIC ends a message by setting bit 7 of its LAST character (the prompt
; leaves as MEMSI + ('Z'|0x80)); the real Model 33 ignored the eighth bit and so does
; strip7out. `upper` folds what you TYPE to uppercase, as a Teletype's keys already were.
SET CONSOLE strip7out=true
SET CONSOLE upper=true

POWER                                 ; fill RAM, pulse POC* -- the machine is now live

; ---- Operate it (the three things a human did in 1975) ----
MOUNT acr0:tape "BASIC Ver 1-0.tap"   ; put the cassette in the recorder
LOAD "LOAD10.HEX"                     ; toggle in the bootstrap
RUN 1800                              ; start it: it reads the tape into 0000.., then spins
;                                       press ^E when the tape is done, then type: RUN 0
