; Altair 4K BASIC 3.1 -- off a period cassette, one-command boot.
;
; The .ini twin of basic4k.toml beside it: the SAME machine, set up by MONITOR COMMANDS
; instead of a declarative TOML, as an easy landing for anyone arriving from AltairZ80 --
; whose .ini files SET and ATTACH exactly like this. Every line is one you could type at
; the altairsim> prompt.
;
; RUN IT (from this directory):
;
;   From the command line:      altairsim -s basic4k.ini
;   From the altairsim> prompt: DO basic4k.ini
;
;   MEMORY SIZE? <return>
;   TERMINAL WIDTH? <return>
;   WANT SIN? Y
;   -> ALTAIR BASIC VERSION 3.1  [FOUR-K VERSION]
;
; `MACHINE basic4k` loads the built-in machine 4K BASIC was sold to run on -- an 88-SIO
; Teletype, an 88-ACR cassette, 4K of RAM, sense switches at 0x80 -- exactly as the TOML's
; `base = "basic4k"` does. (SHOW MACHINES lists the built-ins; SHOW MACHINE basic4k shows
; what is in this one.) It does not matter what machine you launched; MACHINE replaces it.
;
; The tape comes off in about a second rather than the 110 the real 300-baud cassette took,
; because the clock is flat out. `SET cpu0 clock_hz=2000000` buys back the 2 MHz machine and
; its 110 seconds; BASIC cannot tell the difference.

MACHINE basic4k          ; the bare 4K-BASIC Altair (88-SIO, 88-ACR, 4K RAM, sense 0x80)
SET CONSOLE upper=true   ; fold your keystrokes to the upper case a Teletype's keys sent
;                          (the machine's console already sets STRIP7OUT for BASIC's high bit)

; ---- Operate it (put the tape in, toggle the bootstrap, run from 0) ----
MOUNT acr0:tape "4K BASIC Ver 3-1.tap"
LOAD "LDR4K31.HEX"
RUN 0
