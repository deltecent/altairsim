; Altair BASIC 1.0 -- the SAME session as basic1.ini, but loaded from a WAV cassette
; instead of a decoded .tap. This is what a real 88-ACR heard: 300-baud FSK audio.
;
; The .ini twin of basic1-wav.toml beside it, built by MONITOR COMMANDS.
;
; RUN IT (from this directory):
;
;   From the command line:      altairsim -s basic1-wav.ini
;   From the altairsim> prompt: DO basic1-wav.ini
;
;   -> the tape loads; press ^E when it is done, then type:  RUN 0
;
; BASIC 1.0's machine is not a built-in, so `MACHINE none` empties the backplane and the
; BOARDS ADD lines build the bare 1975 Altair: an 88-SIO Teletype, an 88-ACR recorder, 8K of
; RAM. The only difference from basic1.ini is the tape -- "BASIC Ver 1-0.wav", the FSK audio
; the 1975 cassette carried -- which altairsim's ACR demodulates as the real board did. The
; WAV was made from the .tap:  altair_tapetool encode "BASIC Ver 1-0.tap" "BASIC Ver 1-0.wav" fsk300
;
; The boot is still two moves (see basic1.ini for why): RUN 1800 reads the tape in, ^E stops
; when it is done, RUN 0 starts BASIC.

; ---- Build the machine (empty backplane -> the bare 1975 Altair) ----
MACHINE none
BOARDS ADD fp fp0 sense=0x00
BOARDS ADD 8080 cpu0 clock_hz=0
BOARDS ADD sio sio0 port=0
CONNECT sio0 console
BOARDS ADD acr acr0 port=6
SET acr0:tape counter=on
BOARDS ADD memory mem0 fill=random
REGION ADD mem0 type=ram at=0 size=8K
SET CONSOLE strip7out=true
SET CONSOLE upper=true
POWER

; ---- Operate it ----
MOUNT acr0:tape "BASIC Ver 1-0.wav"
LOAD "LOAD10.HEX"
RUN 1800
;                                       press ^E when the tape is done, then type: RUN 0
