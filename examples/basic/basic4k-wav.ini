; Altair 4K BASIC 3.1 -- the SAME session as basic4k.ini, but loaded from a WAV cassette
; instead of a decoded .tap. This is what a real 88-ACR heard: 300-baud FSK audio.
;
; The .ini twin of basic4k-wav.toml beside it, built by MONITOR COMMANDS.
;
; RUN IT (from this directory):
;
;   From the command line:      altairsim -s basic4k-wav.ini
;   From the altairsim> prompt: DO basic4k-wav.ini
;
;   MEMORY SIZE? <return> / TERMINAL WIDTH? <return> / WANT SIN? Y
;
; The only difference from basic4k.ini is the tape: this mounts "4K BASIC Ver 3-1.wav", the
; FSK audio the 1975 cassette actually carried, rather than the decoded bytes. altairsim's
; ACR demodulates it exactly as the real board did. The WAV was made from the .tap with the
; shipped tapetool:  altair_tapetool encode "4K BASIC Ver 3-1.tap" "4K BASIC Ver 3-1.wav" fsk300
;
; Audio decodes at its own pace, so the load takes a moment even flat out. BASIC cannot tell.

MACHINE basic4k          ; the bare 4K-BASIC Altair (88-SIO, 88-ACR, 4K RAM, sense 0x80)
SET CONSOLE upper=true

MOUNT acr0:tape "4K BASIC Ver 3-1.wav"
LOAD "LDR4K31.HEX"
RUN 0
