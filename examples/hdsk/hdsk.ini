; CP/M 2.2 on an 88-HDSK hard disk.
;
; The .ini twin of hdsk.toml beside it: the SAME machine, set up by MONITOR COMMANDS
; instead of a declarative TOML, as an easy landing for anyone arriving from AltairZ80.
; Every line is one you could type at the altairsim> prompt.
;
; RUN IT (from this directory):
;
;   From the command line:      altairsim -s hdsk.ini
;   From the altairsim> prompt: DO hdsk.ini
;
;   -> You land at the A> prompt, running off the hard disk.
;
; `MACHINE default` loads the 56K CP/M Altair (the TOML's `base = "default"`). This file adds
; the 88-HDSK controller at A0, the hard-disk boot PROM (HDBL) at FC00, and the platter to
; boot from. The image is the removable cartridge in drive 0; it is read/write, so copy it
; first if you mean to test writes in anger. POWER after building reads the HDBL image into
; its ROM socket before the boot.

MACHINE default                       ; the 56K Altair (its 56K RAM is what CP/M runs in)
BOARDS ADD hdsk hd0 port=A0           ; the 88-HDSK controller
REGION ADD mem0 type=rom at=FC00 mount=builtin:hdbl   ; the HDBL hard-disk boot PROM
POWER                                 ; read HDBL into its socket; reset the new controller

MOUNT hd0:drive0 "HDCPM22v16-48K.DSK" ; the hard-disk platter (the removable cartridge)
RUN FC00                              ; run the HDBL PROM -> boots CP/M off the hard disk
