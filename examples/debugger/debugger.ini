; A bare 8080 bench for the debugger walkthrough.
;
; The .ini twin of debugger.toml beside it: the SAME machine, built by MONITOR COMMANDS
; instead of a declarative TOML, as an easy landing for anyone arriving from AltairZ80.
; Every line is one you could type at the altairsim> prompt.
;
; RUN IT (from this directory):
;
;   From the command line:      altairsim -s debugger.ini
;   From the altairsim> prompt: DO debugger.ini
;
;   -> the altairsim> monitor prompt, with nothing loaded yet.
;
; There is NO RUN here, on purpose. This machine comes up at the monitor prompt so you can
; DEPOSIT a few bytes and STEP through them -- the README beside this file is the lesson,
; and this is just the bench it runs on. It is not a built-in, so `MACHINE none` empties the
; backplane and the BOARDS ADD lines build it: an 8080, a 2SIO console, 32K of zeroed RAM.

MACHINE none                          ; empty backplane; build the bench onto it
BOARDS ADD 8080 cpu0
BOARDS ADD 2sio sio0 port=10          ; the 2SIO at ports 10/12
CONNECT sio0:a console                ; channel A carries the host console
SET sio0:a baud=9600
CONNECT sio0:b null                   ; channel B goes nowhere
BOARDS ADD memory mem0 fill=zero      ; zeroed RAM, so a STEP off the end reads NOP, not noise
REGION ADD mem0 type=ram at=0 size=32K
POWER                                 ; fill RAM, pulse POC* -- the bench is ready
