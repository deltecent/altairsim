# An Altair with a printer on it, for the printing walkthrough.
#
#     cd examples/printing && altairsim printer.toml
#     -> the altairsim> monitor prompt
#
# The machine is deliberately small: an 8080, 32K of RAM, an 88-2SIO for the console,
# and an 88-C700 parallel printer interface -- the card a program prints THROUGH. The
# C700 has one unit, `prn`, and it starts disconnected (`null`), because what is on the
# far end of the printer cable is a HOST decision, not a machine one. The README beside
# this file is the lesson: it sets up a real print queue on your host and CONNECTs `prn`
# to it, and then a page comes out.
#
# The paths the README types are relative to where you are standing, not to this file --
# so run the commands from this directory (`cd examples/printing` first).

[machine]
name = "printer-demo"

# The processor. clock_hz = 0 is flat out (the default); the banner program is a short
# loop and finishes the instant you RUN it.
[[board]]
type = "8080"
id   = "cpu0"

# The console: an 88-2SIO at port 10, channel A wired to your terminal. Not used for
# printing at all -- it is just so the machine is one you can actually sit at.
[[board]]
type = "2sio"
id   = "sio0"
port = 10

  [board.unit.a]
  connect = "console"
  baud    = 9600

  [board.unit.b]
  connect = "null"

# The printer card: an 88-C700 at port 02 (status/control at 02, data at 03). Its one
# unit `prn` comes up disconnected; the README CONNECTs it to a host print queue.
[[board]]
type = "c700"
id   = "lpt0"
port = 02

# 32K of RAM, 0000-7FFF, zero-filled. The banner program assembles at 0100.
[[board]]
type = "memory"
id   = "mem0"
fill = "zero"

  [[board.region]]
  type = "ram"
  at   = 0000
  size = "32K"
