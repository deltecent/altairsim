; A machine with an 88-C700 line printer, for the printing walkthrough.
;
; The .ini twin of printer.toml beside it: the SAME machine, built by MONITOR COMMANDS
; instead of a declarative TOML, as an easy landing for anyone arriving from AltairZ80.
; Every line is one you could type at the altairsim> prompt.
;
; RUN IT (from this directory):
;
;   From the command line:      altairsim -s printer.ini
;   From the altairsim> prompt: DO printer.ini
;
;   -> the altairsim> monitor prompt.
;
; There is NO RUN here, on purpose: the README beside this file is the lesson. It CONNECTs
; the printer `lpt0:prn` to a host print queue (or a file, or the console) and then runs a
; program that prints. This .ini just builds the bench -- an 8080, a 2SIO console, an 88-C700
; printer at port 02, and 32K of RAM. It is not a built-in, so `MACHINE none` empties the
; backplane and the BOARDS ADD lines build it.

MACHINE none                          ; empty backplane; build the bench onto it
BOARDS ADD 8080 cpu0
BOARDS ADD 2sio sio0 port=10          ; the 2SIO console at ports 10/12
CONNECT sio0:a console
SET sio0:a baud=9600
CONNECT sio0:b null
BOARDS ADD c700 lpt0 port=02          ; the 88-C700 line printer at port 02
BOARDS ADD memory mem0 fill=zero
REGION ADD mem0 type=ram at=0 size=32K
POWER

; Now CONNECT the printer and print -- see README.md. For example, to a file:
;   CONNECT lpt0:prn "printout.txt"
