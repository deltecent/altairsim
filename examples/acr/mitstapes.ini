; The MITS Tapes disk, plus an 88-ACR to write cassettes back out.
;
; The .ini twin of mitstapes.toml beside it: the SAME machine, set up by MONITOR COMMANDS
; instead of a declarative TOML, as an easy landing for anyone arriving from AltairZ80.
; Every line is one you could type at the altairsim> prompt.
;
; RUN IT (from this directory):
;
;   From the command line:      altairsim -s mitstapes.ini
;   From the altairsim> prompt: DO mitstapes.ini
;
;   -> You land at the A> prompt. TYPE CONTENTS.TXT to see what is on the disk.
;
; `MACHINE default` loads the 56K CP/M Altair (the TOML's `base = "default"`). This file adds
; two things the default has not got: the MITS Tapes disk in drive 0, and an 88-ACR at 006 so
; a guest utility (WRTAPE.COM) can write a `.TAP` back out through the recorder. The disk is a
; 48K MITS CP/M 2.2; it boots fine in this 56K machine, because an image asks only for a
; machine at least as big. See README.md for the full cassette workflow.

MACHINE default                       ; the 56K CP/M Altair, DBL boot PROM at FF00
BOARDS ADD acr acr0 port=6            ; add the 88-ACR cassette recorder at 006
POWER                                 ; give the freshly added card its power-on reset

MOUNT dsk0:drive0 "MITS Tapes.dsk"    ; the MITS Tapes system disk in drive 0
SET CONSOLE bsdel=bs
RUN FF00                              ; boot CP/M
