name: CI

# Build a native altairsim binary on each platform and run the fast test suite.
# The ~10-min 8080 exerciser (label "slow") is NOT run here -- see cpu-exerciser.yml,
# which runs it only when CPU/ISA code changes.
#
# A PR RUNS THREE LEGS ONLY WHEN IT TOUCHES CORE. MASTER RUNS THREE AFTER EVERY CODE MERGE.
#
#   change (tools/ci-changed-code.sh)   pull request    push to master
#   docs                                Linux           Linux, or nothing if the PR tested it
#   code  (boards, cli, mcp, tests...)  Linux           Linux + macOS + Windows
#   core  (core, cpu, platform, host,   Linux + macOS   Linux + macOS + Windows -- build only,
#          build, CI, anything new)     + Windows       no tests, if the PR tested it
#
# Most PRs are a board, a monitor command or a test: portable C++ above the platform layer.
# Building those on three operating systems before the merge made every PR wait on the
# slowest leg (Windows, ~5 min) to learn what Linux had already said. They now build on Linux,
# and the run on master after the merge builds all three. Nobody waits on that run, and an
# MSVC- or Clang-only warning in a board shows up minutes after the merge, not at release.
# A change to the core -- the bus, the CPU, the platform layer, the SDL host, the build --
# is where the platforms really differ, so it still builds three before the merge.
#
# The fast suite VALIDATES the documentation -- docs-manual (the User Manual names nothing
# outside the shipped package) and docs-reference (the committed docs/manual/ref/*.md matches
# what the binary emits) both run here, and both need the binary. So a docs change is not a
# no-op for CI and must not skip it; it runs the Linux leg. There is no branch protection
# requiring the legs by name, so a reduced matrix cannot deadlock a PR the way a trigger-level
# `paths:` filter would.
#
# THE MASTER RUN ALSO KEEPS THE COMPILER CACHE WARM. A PR can read only its own cache entries
# and master's. When master merges skipped the build (#543), master's cache went stale, and
# every PR compiled almost from scratch -- see the build job.
on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

# A DOCUMENTATION MERGE THAT CHANGED NO FILES DOES NOT BUILD AGAIN. Merging an up-to-date docs
# PR makes a commit whose tree is byte-identical to the PR head CI just passed on Linux; `scope`
# sees that (tools/ci-merge-already-tested.sh) and `build` is skipped (issue #543). A CODE merge
# builds three legs even then: its PR may have built only Linux, and master's cache needs it.
#
# A CORE MERGE THAT CHANGED NO FILES BUILDS BUT DOES NOT TEST AGAIN. Its PR passed the suite on
# all three platforms with these exact files, so the tests would prove nothing new (issue #641).
# The build still runs, on all three, because it is what saves master's compiler cache.
#
# A NEWER PUSH TO A PR CANCELS THE OLDER RUN, which nobody will read. Pushes to master are
# grouped by commit instead, so no master run ever cancels or queues behind another.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Look at what actually changed and choose the build matrix (the table at the top). An
  # unrecognized path is core, so a new directory is never built on fewer platforms than it needs.
  scope:
    name: Classify the change
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      level: ${{ steps.pick.outputs.level }}
      tested: ${{ steps.pick.outputs.tested }}
      build_only: ${{ steps.pick.outputs.build_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0            # need the base commit present to diff against it

      - id: pick
        shell: bash
        run: |
          set -euo pipefail

          # The legs.
          #   macos-15 is the Apple-Silicon runner. This leg BUILDS NATIVE arm64 and is the
          #   one leg with SDL3 installed, so it is the only place display_sdl.cpp is
          #   compiled at all -- see the Configure step. It used to cross-build a universal
          #   x86_64+arm64 binary, back when CI artifacts WERE the release. They are not any
          #   more (DISTRIBUTION.md: each package is built natively on its own machine,
          #   including an Intel Mac), and universal is mutually exclusive with a Homebrew
          #   SDL3, which is arm64-only and will not link into a fat binary. Native buys the
          #   video path a compiler; the x86_64 slice is covered natively off-CI instead.
          #   windows-2025-vs2026, not windows-latest: the Windows release box builds with
          #   Visual Studio 2026 (tools/windows/setup-windows-worker.ps1), and this is the image
          #   with that same MSVC. Named outright so a moved -latest label cannot quietly put CI
          #   and the release on different compilers again -- the 2022/2026 split let a warning
          #   through that only the release compiler reported.
          linux='{"name":"linux-x86_64","os":"ubuntu-latest","artifact":"altairsim-linux-x86_64","binary":"build/altairsim"}'
          macos='{"name":"macos-arm64","os":"macos-15","artifact":"altairsim-macos-arm64","binary":"build/altairsim"}'
          windows='{"name":"windows-x86_64","os":"windows-2025-vs2026","artifact":"altairsim-windows-x86_64","binary":"build/altairsim.exe"}'
          full="{\"include\":[$linux,$macos,$windows]}"
          linuxonly="{\"include\":[$linux]}"

          # What kind of change? The path rule lives in tools/ci-changed-code.sh (docs, code or
          # core), so it can be run against any commit locally.
          #   - a PR: everything the PR adds to its base.
          #   - a pushed merge: what the merge added to master, HEAD^1..HEAD. A docs PR cut from
          #     an old master is still docs this way, because master already has the rest.
          #   - any other push: since the previous tip. The first push of a branch has no usable
          #     base -- take no chances and call it core.
          #   - workflow_dispatch: somebody asked for the full answer.
          event='${{ github.event_name }}'
          if [ "$event" = "pull_request" ]; then
            level=$(bash tools/ci-changed-code.sh '${{ github.event.pull_request.base.sha }}')
          elif [ "$event" = "push" ] && git rev-parse --verify --quiet 'HEAD^2' >/dev/null; then
            level=$(bash tools/ci-changed-code.sh 'HEAD^1')
          elif [ "$event" = "push" ]; then
            base='${{ github.event.before }}'
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              echo "no base to diff against -- treating it as core"
              level=core
            else
              level=$(bash tools/ci-changed-code.sh "$base")
            fi
          else
            echo "event is '$event' -- full matrix"
            level=core
          fi
          echo "level=$level" >> "$GITHUB_OUTPUT"

          # A docs merge whose PR run already tested this exact tree is skipped. The matrix
          # still has to be valid JSON even for a job that will not run -- a matrix cannot be
          # empty -- so hand over the one-leg one. A code merge is never skipped: its PR may have
          # built Linux only, and the master run is what refreshes master's compiler cache.
          #
          # A core merge of such a tree is not skipped either, but it builds only: its PR ran the
          # suite on all three platforms, so the build job leaves out the tests and the binary
          # upload and keeps the build, which saves the cache (issue #641).
          tested=false
          build_only=false
          if [ "$level" = "docs" ]; then
            tested=$(bash tools/ci-merge-already-tested.sh "$event")
          elif [ "$level" = "core" ]; then
            build_only=$(bash tools/ci-merge-already-tested.sh "$event")
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
          echo "build_only=$build_only" >> "$GITHUB_OUTPUT"
          if [ "$build_only" = "true" ]; then
            echo "core merge of a tree its PR already tested -- build only, no tests"
          fi

          if [ "$level" = "core" ] || { [ "$event" != "pull_request" ] && [ "$level" = "code" ]; }; then
            echo "$level change on $event -- Linux, macOS and Windows"
            echo "matrix=$full" >> "$GITHUB_OUTPUT"
          else
            echo "$level change on $event -- Linux only (master builds all three after a code merge)"
            echo "matrix=$linuxonly" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: scope
    if: needs.scope.outputs.tested != 'true'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # THE WAIT IN CI IS THE COMPILE, AND THEN THE TESTS RUN ONE AT A TIME. Three levers:
    #   - sccache caches object files across runs keyed on the preprocessed source and the
    #     compiler+flags, so a warm push only recompiles the TUs the diff touched.
    #   - Ninja instead of MSBuild on Windows (see the MSVC step): 258s->188s by itself.
    #   - ctest --parallel (see the Test step).
    #
    # THE CACHE IS ONE FILE PER LEG ON DISK, NOT SCCACHE'S ACTIONS-CACHE BACKEND. That backend
    # (SCCACHE_GHA_ENABLED) stores every object file as its own cache entry. MEASURED on PR #639:
    # Windows 238 of 238 writes failed (0% hits, a 5m12s build -- every run cold), Linux 87 and
    # macOS 104 writes failed, and hit rates were 21% and 16%; 11,631 tiny entries had piled up.
    # Now sccache keeps a plain local directory, restored from and saved to one actions/cache
    # entry per leg. MSVC has no special case on a local disk.
    #
    # THE KEY CHANGES EVERY RUN, SO EVERY RUN SAVES. An actions/cache key cannot be overwritten,
    # so it carries the commit and the attempt; restore-keys picks the newest entry for the leg.
    # Which entries a run can SEE is GitHub's rule: its own branch's and master's. That is why a
    # master code merge always builds (see the scope job): without it, master's entry ages and
    # every new PR starts cold.
    env:
      SCCACHE_CACHE_SIZE: 1G
    # All legs that run are required to pass. Windows was advisory (continue-on-error) while
    # src/platform/win32/ was being brought up; it now compiles, links, and passes the full
    # suite on MSVC, so a Windows regression blocks a PR like any other. fail-fast is off so
    # one platform's failure does not cancel the others.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}

    steps:
      # FULL HISTORY, BECAUSE THE BINARY NAMES ITS OWN COMMIT. CMakeLists.txt bakes
      # `git describe --tags --always` into --version, and at the default depth of 1 no
      # tag is reachable -- so every CI artifact reported a bare short sha instead of
      # v0.1.0-N-gsha. Both are traceable; only one is legible in a bug report, and these
      # are the binaries handed to people to try (tools/fetch-ci-binaries.sh pulls them).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The compiler cache. Installs the sccache binary; SCCACHE_DIR is where it keeps objects
      # (set here because the runner context is not available in job-level env), and the
      # restore below fills that directory from the newest entry for this leg. The Configure
      # step points CMake's compiler launcher at it on every leg.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Compiler cache directory
        shell: bash
        run: echo "SCCACHE_DIR=${{ runner.temp }}/sccache" >> "$GITHUB_ENV"

      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ matrix.name }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: sccache-${{ matrix.name }}-

      # WINDOWS BUILDS WITH NINJA + MSVC, NOT THE VISUAL STUDIO GENERATOR. Two reasons, and the
      # first turned out to be the one that pays: Ninja is simply faster than MSBuild here (leg
      # 258s->188s). The second was the original motive -- sccache hooks in through CMake's
      # COMPILER_LAUNCHER, which the VS/MSBuild generator ignores while Ninja and Makefiles
      # honor it -- but MSVC+sccache gets 0% against the Actions cache today, so on this leg
      # the launcher is wired and waiting rather than helping. Ninja is a single-config
      # generator, which is why the Windows binary is build/altairsim.exe (no Release/ subdir)
      # above. msvc-dev-cmd puts cl.exe and the MSVC environment into GITHUB_ENV so every later
      # step -- Configure, Build, Test -- sees the toolchain without a vcvars dance of its own.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # expect drives the interactive acceptance tests. Ubuntu needs it installed;
      # macOS ships it; Windows gets none -- those tests self-skip at configure time
      # (CMakeLists.txt: if(EXPECT_EXECUTABLE)) and the build/other tests still run.
      # The install goes through tools/ci-apt-install.sh because the runners'
      # `apt-get update` intermittently HANGS on a slow mirror; the helper tries a
      # plain install first, times out and retries, and fails fast instead of stalling.
      - name: Install expect (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 12
        run: bash tools/ci-apt-install.sh expect

      # SDL3 ON EXACTLY ONE LEG, AND THAT IS THE POINT. display_sdl.cpp is macro-gated
      # behind find_package(SDL3), so with no SDL3 anywhere in CI it was compiled by
      # NOTHING and a change that broke it went green on all three platforms. Every
      # binary the project shipped through v0.2.0 was headless for the same reason.
      # One leg with a real SDL3 closes that. macOS is the cheap one: brew has it, and
      # this leg no longer builds universal, which is what made brew's arm64-only SDL3
      # unusable here before.
      - name: Install SDL3 (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl3

      # Configure ONCE and keep the log: the SDL3 line is printed by the configure that
      # evaluates find_package, so re-running to "check" it is both wasteful and unreliable
      # against a warm cache. Capture, then assert against what was captured.
      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          # Ninja on Windows (see the MSVC step); the platform default elsewhere. The compiler
          # launcher is set on every leg -- Makefiles (Linux/macOS default) and Ninja both honor
          # it, which is the whole reason Windows is on Ninja.
          gen=""
          [ "${{ runner.os }}" = "Windows" ] && gen="-G Ninja"
          # -DWERROR=on makes a warning fail the build on every leg -- this is where the
          # zero-warnings rule is enforced. It is OFF in CMakeLists.txt by default so a
          # local or unfamiliar toolchain still builds; each of GCC, Clang and MSVC has its
          # own warning set, and here all three must be clean at once (issue #222).
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DWERROR=on \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            $gen 2>&1 | tee configure.log
          grep -E "SDL3 (found|not found)" configure.log || true

      # AND FAIL THE MAC LEG IF IT CAME UP HEADLESS. That line has been in the configure
      # log all along; nobody read it, and that is the entire history of the bug above.
      # This reads it every time, so the coverage cannot lapse silently.
      - name: The macOS leg must have SDL3
        if: runner.os == 'macOS'
        shell: bash
        run: |
          grep -q "SDL3 found" configure.log || {
            echo "::error::this leg came up HEADLESS -- it is the only one that compiles display_sdl.cpp"
            exit 1
          }

      - name: Build
        run: cmake --build build --config Release --parallel

      # What the cache actually did this run. A near-100% hit rate on a warm run is the
      # payoff; a run that shows all misses (a new compiler image, a cache eviction) is the
      # cold case this is meant to make rare, and this line is where you see which you got.
      - name: sccache stats
        run: sccache --show-stats

      # Stop the server so every object is on disk, then save. Saved after the build, not at
      # the end of the job, so a red test still leaves the next push a warm cache.
      - name: Stop sccache
        run: sccache --stop-server

      - name: Save the compiler cache
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ matrix.name }}-${{ github.sha }}-${{ github.run_attempt }}

      # SAY WHICH COMMIT THIS IS, in the log, on every leg. The version string is baked in
      # at configure time from `git describe`, so it is the one thing in the run that can
      # go quietly wrong without failing anything: revert the checkout above to the default
      # depth and the artifacts still build, still pass, and silently stop naming their
      # tag. This line is where that would be visible.
      - name: Version
        shell: bash
        run: |
          "${{ matrix.binary }}" --version

      # Fast suite only. Every leg is single-config now (Windows moved to Ninja), so -C Release
      # is a harmless no-op rather than the requirement it was under the VS generator -- kept
      # so the line reads the same everywhere. serial-hw self-skips (exit 77); disk-gated tests
      # are not registered without the (non-git) CP/M images.
      #
      # IN PARALLEL. One at a time the suite took 130s on Linux and 152s on macOS, while its
      # longest test (`unit`) takes 18-36s. Every acceptance script works in its own scratch
      # folder under the build tree, so the tests do not share files. A test that fails only
      # when run beside others has a real bug, and gets it fixed -- never RUN_SERIAL to hide it.
      #
      # NOT ON A BUILD-ONLY RUN (see the scope job): the PR run passed this suite on this
      # platform with the same files, and it holds the binary.
      - name: Test (fast)
        if: needs.scope.outputs.build_only != 'true'
        run: ctest --test-dir build -C Release -LE slow --output-on-failure --parallel 4

      - name: Upload binary
        if: needs.scope.outputs.build_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
