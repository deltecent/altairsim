# SSM PB1 EPROM-programmer machine -- burn a 2708/2716 and save the result as a hex file.
#
#     altairsim pb1
#     LOAD roms/SSM-PB1/PB1PROG.HEX          ; the SSM 2708 burner + a 1K test pattern at 4000
#     G 100                                  ; run it: programs the 2708 in the socket window
#     SAVE eprom.hex D000 D3FF               ; the burn, as an Intel HEX file on the host
#
# The PB1 is a programmer, not a boot device -- there is no disk and no monitor PROM here, just
# enough machine to load a burner routine, run it against the board, and read the burned socket
# back out. See docs/boards/ssm-pb1.md and reference/SSM PB1 EPROM Programmer.md.

[machine]
name = "pb1"

# THE CPU. A stock 2 MHz 8080; clock_hz = 0 runs it flat out.
[[board]]
type     = "8080"
id       = "cpu0"
clock_hz = 0

# THE CONSOLE, moved down to ports 00-03 so the PB1's control port can keep its documented 10H
# (the SSM burner software hard-codes CPORT = 10H). Channel B is left unconnected.
[[board]]
type = "2sio"
id   = "sio0"
port = 00

  [board.unit.a]
  connect = "console"
  baud    = 9600

  [board.unit.b]
  connect = "null"
  baud    = 9600

# THE FRONT PANEL, so RUN/EXAMINE/DEPOSIT and the sense switches work.
[[board]]
type = "fp"
id   = "fp0"

# THE PB1. Control port 10H, the 4K programming window at D000 (matching the SSM software's
# PROM = D000H). Both sockets start with an erased (all-FF) chip; burn one, then SAVE it.
[[board]]
type   = "pb1"
id     = "pb1"
port   = 10
window = D000

# 52K OF RAM (0000-CFFF): the burner runs at 0100 and its source data sits at 4000, both well
# below the PB1 window at D000. Real static RAM does not come up zeroed.
[[board]]
type = "memory"
id   = "mem0"
fill = "random"

  [[board.region]]
  type = "ram"
  at   = 0000
  size = "52K"                     # 0000-CFFF
