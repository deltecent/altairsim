# A stock Altair with a CompuPro System Support 1 board for its clock/calendar.
#
#     altairsim compupro
#
# This is the `default` machine (88-CPU, 62K RAM + the DBL boot PROM, an 88-2SIO
# console, the front panel) with one card added: the System Support 1 at the CompuPro
# standard base of 50H. The card carries an OKI MSM5832 real-time clock (base+10/+11),
# a 2651 serial channel (base+12..+15), an 8253 interval timer (base+4..+7) and two
# cascaded 8259A interrupt controllers (base+0..+3); only the (empty) math-chip socket
# is left (issue #392).
#
# READING THE CLOCK FROM THE MONITOR. The clock lives at 5A (command) / 5B (data).
# Select a digit for reading, then read the data port -- e.g. the hours-ones digit
# (digit 4):
#
#     altairsim> OUT 5A 14        # command: Read (bit4) + digit-select 4 (hours ones)
#     altairsim> IN 5B            # -> the BCD hours-ones digit, low nibble
#
# The full digit map and the set sequence are in reference/OKI MSM5832.md and
# reference/CompuPro System Support 1.md. The clock reads the HOST's wall time until a
# guest sets it, and it is battery-backed: a set survives RESET.
#
# THE SERIAL CHANNEL. The 2651 UART sits at 5C (data) / 5D (status) / 5E (mode) /
# 5F (command). It is a spare port here -- the console stays on the 88-2SIO -- so
# connect it to something with, e.g., `CONNECT ss1:serial socket:2651`. Its rate,
# frame and RS-232 handshaking are all programmed through the mode/command registers
# (reference/Signetics 2651 USART.md); the `baud` unit property seeds the line until
# then.
#
# THE INTERVAL TIMER. The 8253 sits at 54/55/56 (counters 0/1/2) and 57 (control word).
# Program a counter by writing the control word then the count; the counters tick at
# 2 MHz. `SHOW ss1` prints a live `timer` line with each counter's mode, count and
# output (reference/Intel 8253.md).
#
# THE INTERRUPT CONTROLLERS. Two 8259As sit at 50/51 (master) and 52/53 (slave),
# cascaded: the master watches the bus's vectored-interrupt lines and drives the CPU,
# the slave gathers the on-board timer and UART interrupts. Program them the usual
# 8259A way (ICW1..ICW4 then OCW1 to unmask); on an interrupt the master hands the CPU
# a CALL to the winning source's vector. `SHOW ss1` prints a live `pic` line. Do not
# also fit an 88-VI -- the SS-1's master already prioritizes the VI lines
# (reference/Intel 8259A.md).

[machine]
name = "compupro"
base = "default"

# The System Support 1. `base` is the 16-port block base; 50H is the CompuPro standard.
[[board]]
type = "ss1"
id   = "ss1"
base = 50
