# A Cromemco Dazzler + D+7A + JS-1 joysticks -- the S-100 game console of 1976.
#
# `altairsim d7a` comes up at the monitor prompt with a Dazzler for the picture and a
# D+7A for the joysticks and sound. The D+7A reads one or two JS-1 joystick consoles;
# here console 1 is mapped to `auto` -- the first USB gamepad the host sees, or the
# keyboard (arrow keys + Space/Z/X/C) if none is plugged in. Plug in a USB controller
# and it just works; with a Dazzler window focused (`SET DISPLAY focus=on`), the keyboard
# stands in.
#
#   SHOW d7a0            # the joystick assignment and analog/parallel ports
#   SET d7a0 joystick2=1 # give console 2 a second controller
#
# See reference/D+7A.md, reference/JS-1.md and docs/boards/cromemco-d7a.md.

[machine]
name = "d7a"

[[board]]
type     = "8080"
id       = "cpu0"
clock_hz = 4000000              # 4 MHz (Cromemco Z-1 speed); SET cpu0 clock_hz=0 for flat out

# A console, so you can type at the monitor -- the Dazzler is a display and the D+7A is a
# joystick port, neither is a keyboard.
[[board]]
type = "2sio"
id   = "sio0"
port = 10

  [board.unit.a]
  connect = "console"
  baud    = 9600

  [board.unit.b]
  connect = "null"

# THE DAZZLER -- the picture. Control/status at 0EH, format at 0FH (the defaults).
[[board]]
type = "dazzler"
id   = "daz0"
port = 0x0E

# THE D+7A -- the joysticks and (future) sound. Eight ports from 0x18: parallel input
# (buttons) at 0x18, the analog channels at 0x19..0x1F. Console 1 follows the host's
# first gamepad or the keyboard; console 2 is unwired until you assign it.
[[board]]
type      = "d7a"
id        = "d7a0"
port      = 0x18
joystick1 = "auto"
joystick2 = "none"

# 64K of RAM for the program and the Dazzler's framebuffer.
[[board]]
type = "memory"
id   = "mem0"
fill = "random"

  [[board.region]]
  type = "ram"
  at   = 0000
  size = "64K"
