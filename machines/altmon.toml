# An Altair with a monitor in ROM and a terminal on it.
#
# THE SMALLEST MACHINE THAT IS ACTUALLY USABLE BY A HUMAN. `original` has no ROM and no
# terminal -- you toggle it in, as you did in 1975. `default` is aimed at booting
# CP/M off a disk that does not exist yet. This one you can just TALK to:
#
#     altairsim altmon
#     CONSOLE
#
# ...and ALTMON prints its banner and a prompt, and D, M, E, S and the rest work.
#
# It also carries the DBL boot PROM at FF00 and an 88-DCDD, the same pair as `default`,
# so the machine you can talk to can also boot a disk. ALTMON is what runs on power-up;
# when you want CP/M, mount a drive and jump to the PROM:
#
#     altairsim altmon
#     MOUNT dsk0:drive0 "<image>"
#     RUN FF00
#
# The RAM here runs to F7FF, just under the ROM (62K), so a 56K CP/M image boots fine --
# its BIOS sits well below F800.
#
# ALTMON is Mike Douglas's 1K monitor for the Altair (roms/ALTMON), based on the
# Vector Graphic 2.0C monitor and reworked to drive an 88-2SIO. It expects:
#
#   - itself at F800 (its `org`),
#   - a stack at C000, which it sets on entry -- so there must be RAM below that,
#   - an 88-2SIO at port 10, console on channel A. It initializes BOTH channels,
#     because it can load Intel HEX over either one.
#
# So this file is not a set of choices. It is what the ROM requires, and every
# line of it is dictated by the listing in roms/ALTMON/ALTMON.ASM.

[machine]
name    = "altmon"

# It runs on its own the moment the machine is switched on -- because that is
# what a monitor PROM in a turnkey machine DID. There is no BOOT command
# (DESIGN.md 10.0): a config that should start says so with the operator's own
# keystroke, written down.
startup = ["RUN F800"]

# EVERY [machine] KEY MUST COME BEFORE THE FIRST [[board]]. That is TOML, not a rule
# of ours: once a table header opens, the keys under it belong to THAT table. Put the
# panel above `startup` and `startup` becomes a property of the panel -- which is
# exactly what happened here first, and the loader said so:
#
#     [[board]] fp0: fp0 has no property 'startup'. Known: sense
#
# The board's own reflection caught it (DESIGN.md 5). It could not have been a silent
# misconfiguration, because there is no place for an unknown key to go.

# The front panel. ALTMON never reads it -- it is built with TKYDSBL = 0, so its
# `in SENSESW` is not even assembled, and it hard-codes the 2SIO to 8N2 (ALTMON.ASM:
# `mvi a,11h ;8N2`). The board is here because a real Altair HAS a front panel, not
# because this ROM needs one.
#
# DBL, now at FF00, DOES read it: it tests SA12 (bit 4) to pick the stop bits, and
# sense = 0x00 leaves SA12 down, which DBL reads as 8N2 (DBL.ASM:166) -- exactly the
# frame ALTMON hard-codes, so the monitor and the boot PROM agree on the wire.
#
# (If TKYDSBL were ever set to 1, that `IN 0FFH` would be read for its SIDE EFFECT
# and not its value: it is how you tell an 88-TURNKEY board to switch its PROM out.
# That board would SNOOP the read, not answer it -- see boards/mits-frontpanel.h --
# so it would not contend with this board for the port.)
[[board]]
type  = "fp"
id    = "fp0"
sense = 0x00

[[board]]
type     = "8080"
id       = "cpu0"
clock_hz = 0        # flat out (the default). `SET cpu0 clock_hz=2000000` for the real 2 MHz.

# The terminal. Channel A is the console; channel B is a second line ALTMON will
# also happily take an Intel HEX file on, and it is left unconnected here -- which
# is not an error and not a gap. An unconnected 6850 sits there with TDRE set
# forever and ALTMON's initialization of it works fine and talks to nobody,
# exactly as the card does with no cable in the second socket.
[[board]]
type = "2sio"
id   = "sio0"
port = 10

  [board.unit.a]
  connect = "console"
  baud    = 9600

  [board.unit.b]
  connect = "null"
  baud    = 9600

# THE FLOPPY CONTROLLER -- an 88-DCDD at 0x08, the card DBL is hard-wired to: it selects
# drive 0 at port 08 and shifts the first sector in through 0A. Four drives, no disks --
# an Altair shipped with the controller and the cable, not with your floppy. Mount one and
# `RUN FF00` boots it; leave them empty and ALTMON is still all there for you to talk to.
[[board]]
type   = "dcdd"
id     = "dsk0"
port   = 08
drives = 4

[[board]]
type = "memory"
id   = "mem0"
fill = "random"

  # RAM right up to the ROM: 0000-F7FF, 62K, the last byte sitting just under ALTMON at
  # F800. The stack ALTMON puts at C000 (pushing DOWNWARD) has RAM under it many times
  # over; filling to F7FF is what lets a CP/M booted from FF00 load its CCP/BDOS/BIOS into
  # the high RAM just below the PROM.
  [[board.region]]
  type = "ram"
  at   = 0000
  size = "62K"

  [[board.region]]
  type  = "rom"
  at    = F800
  mount = "builtin:altmon"

  # The DBL boot PROM at FF00, the same one `default` carries. ALTMON runs on power-up;
  # this is here so `RUN FF00` boots a mounted disk from the very machine you talk to.
  [[board.region]]
  type  = "rom"
  at    = FF00
  mount = "builtin:dbl"
